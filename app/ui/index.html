<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>挖红薯</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <img class="brand-mark" src="../assets/icon.png" alt="" />
        <div>
          <strong>挖红薯</strong>
          <small>小红书媒体采收工具</small>
        </div>
      </div>
      <nav class="browser-actions" aria-label="浏览器操作">
        <button id="back" title="后退">←</button>
        <button id="forward" title="前进">→</button>
        <button id="reload" title="刷新">↻</button>
        <button id="home" title="小红书首页">⌂</button>
      </nav>
      <div class="address">
        <span class="secure">●</span>
        <input
          id="address-input"
          type="text"
          aria-label="小红书地址"
          autocomplete="off"
          spellcheck="false"
          value="正在打开小红书…"
        />
        <button id="go" type="button" title="打开输入的链接">前往</button>
      </div>
      <div class="zoom-controls" aria-label="网页缩放">
        <button id="zoom-out" title="缩小网页（Ctrl+-）">−</button>
        <button id="zoom-reset" title="恢复 100%（Ctrl+0）">100%</button>
        <button id="zoom-in" title="放大网页（Ctrl++）">＋</button>
      </div>
      <button id="settings" class="quiet" title="偏好设置">设置</button>
      <button id="devtools" class="quiet" title="打开内置页面开发工具">
        调试
      </button>
    </header>

    <aside class="panel">
      <section class="intro">
        <span id="page-badge" class="badge">正在识别</span>
        <h1 id="page-title">正在读取当前页面</h1>
        <p id="page-help">
          登录状态只保存在挖红薯自己的浏览器会话中。
        </p>
      </section>

      <section id="options" class="card">
        <label id="limit-label" for="limit">下载前多少篇</label>
        <div id="limit-row" class="number-row">
          <button id="minus" aria-label="减少">−</button>
          <input id="limit" type="number" min="1" max="1000" value="3" />
          <button id="plus" aria-label="增加">＋</button>
        </div>
        <button id="start" class="primary" disabled>等待页面识别</button>
      </section>

      <section id="task" class="task hidden" aria-live="polite">
        <div class="task-heading">
          <div>
            <span id="task-state">准备中</span>
            <strong id="task-title">当前任务</strong>
          </div>
          <span id="task-percent">0%</span>
        </div>
        <div class="progress"><i id="progress-bar"></i></div>
        <p id="task-detail">正在准备…</p>
        <p id="task-error" class="error hidden"></p>
        <button id="cancel" class="danger">停止任务</button>
      </section>

      <footer>
        <button id="downloads" class="folder">打开下载目录</button>
        <p>文件保存到 Windows 下载目录中的“挖红薯”文件夹。</p>
      </footer>
    </aside>

    <dialog id="settings-dialog" class="settings-dialog">
      <form method="dialog" class="settings-sheet">
        <div class="settings-heading">
          <div>
            <span>应用设置</span>
            <h2>偏好设置</h2>
          </div>
          <button class="icon-close" value="close" aria-label="关闭">×</button>
        </div>

        <section class="setting-block">
          <label>下载位置</label>
          <p id="download-directory" class="path-value"></p>
          <div class="setting-actions">
            <button id="choose-download-directory" type="button">
              选择文件夹
            </button>
            <button id="reset-download-directory" type="button" class="text-button">
              恢复默认位置
            </button>
          </div>
        </section>

        <section class="setting-block">
          <label>内置网页缩放</label>
          <div class="settings-zoom">
            <button id="settings-zoom-out" type="button">−</button>
            <output id="settings-zoom-value">100%</output>
            <button id="settings-zoom-in" type="button">＋</button>
          </div>
          <p class="hint">范围为 50%–200%，也可以使用 Ctrl＋、Ctrl− 和 Ctrl＋0。</p>
        </section>

        <section class="setting-block">
          <label>小红书登录</label>
          <p class="hint">
            登录状态自动保存在这台电脑上，并使用 Windows 系统加密备份；不会写进 EXE 或下载目录。
          </p>
          <p id="user-data-directory" class="path-value"></p>
          <button id="open-user-data" type="button" class="text-button standalone">
            打开应用数据目录
          </button>
        </section>
      </form>
    </dialog>

    <script src="renderer.js"></script>
  </body>
</html>

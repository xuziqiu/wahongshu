name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pillow pyinstaller
      - run: npm ci
      - run: npm run dist
        env:
          WAHONGSHU_RELEASE_BASENAME: WaHongShu
      - name: Publish GUI, CLI and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File |
            Where-Object { $_.Name -match '\.exe(?:\.sha256)?$' } |
            Select-Object -ExpandProperty FullName
          if ($assets.Count -ne 4) {
            throw "Expected GUI and CLI executables plus two SHA-256 files."
          }
          gh release create $env:GITHUB_REF_NAME $assets --generate-notes

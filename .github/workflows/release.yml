name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: npm ci
      - run: npm run dist
      - name: Publish portable executable and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File |
            Where-Object { $_.Name -match '\.exe(?:\.sha256)?$' } |
            Select-Object -ExpandProperty FullName
          if ($assets.Count -ne 2) {
            throw "Expected one portable EXE and one SHA-256 file."
          }
          gh release create $env:GITHUB_REF_NAME $assets --generate-notes
